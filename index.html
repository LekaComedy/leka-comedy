<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home — Leka Comedy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #3e2723; /* Deep vintage brown */
            color: #ffcc80; /* Soft warm text */
        }
        .text-velma {
            color: #ff9800; /* Vibrant retro orange */
        }
        .border-velma {
            border-color: #ff9800;
        }
        .bg-velma-dark {
            background-color: #4e342e;
        }
        .nav-link {
            color: #ffcc80;
        }
        .nav-link.active {
            color: #ff9800;
            background-color: rgba(255, 152, 0, 0.15);
            border: 1px solid rgba(255, 152, 0, 0.5);
            padding: 8px 16px;
            border-radius: 9999px;
        }
        .nav-link:hover {
            color: #ff9800;
        }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col">
    
    <!-- Navigation Header with Small Logo -->
    <header class="border-b border-[#ff9800]/30 sticky top-0 bg-[#3e2723] z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 md:h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center">
                <img src="LKACMDYLogo.jpg" alt="Leka Comedy Logo" class="h-10 md:h-14 w-auto object-contain rounded-md border border-[#ff9800]/50 shadow-sm hover:scale-105 transition-transform duration-200">
            </a>
            <nav class="hidden md:flex gap-6 items-center">
                <a href="index.html" class="text-sm font-semibold nav-link active">Home</a>
                <a href="about.html" class="text-sm font-semibold nav-link">About Me</a>
                <a href="gallery.html" class="text-sm font-semibold nav-link">Upcoming Shows</a>
                <a href="reviews.html" class="text-sm font-semibold nav-link">Reviews</a>
                <a href="contact.html" class="text-sm font-semibold nav-link">Contact</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow">
        <!-- Hero Section -->
        <section class="relative overflow-hidden py-20 md:py-28 px-4 text-center bg-[#3e2723]">
            <span class="absolute top-8 left-16 text-2xl select-none pointer-events-none text-velma">✦</span>
            <span class="absolute top-14 right-20 text-xl select-none pointer-events-none text-velma">✦</span>
            <span class="absolute bottom-10 left-1/3 text-lg select-none pointer-events-none text-velma">✦</span>
            
            <div class="max-w-3xl mx-auto flex flex-col items-center gap-6">
                <span class="inline-block px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest border border-velma text-velma bg-[#ff9800]/15">
                    Albuquerque, New Mexico
                </span>
                <h1 class="text-4xl md:text-6xl font-bold text-velma" style="font-family: serif;">Leka Comedy</h1>
                <p class="text-xl md:text-2xl text-[#ffcc80]/90 font-medium">Stand-up Comedian, Writer, &amp; Nerdy Observer</p>
                
                <!-- Larger Image Underneath Subheading -->
                <div class="my-4 w-full max-w-lg px-4">
                    <div class="p-2 bg-[#4e342e] rounded-2xl border-2 border-velma shadow-2xl overflow-hidden transform hover:scale-[1.01] transition-transform duration-300">
                        <img src="LKACMDYLogo.jpg" alt="Leka Comedy License Plate Logo" class="w-full h-auto rounded-xl">
                    </div>
                </div>

                <div class="flex flex-wrap justify-center gap-4 mt-2">
                    <a href="gallery.html" class="px-7 py-3 rounded-full font-bold text-sm border-2 border-velma text-velma bg-transparent hover:bg-velma/10 transition-all duration-200">
                        Upcoming Shows
                    </a>
                    <a href="contact.html" class="px-7 py-3 rounded-full font-bold text-sm bg-velma text-[#3e2723] hover:bg-velma/90 transition-all duration-200 shadow-md">
                        Book Leka
                    </a>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="border-t py-10 px-4 bg-velma-dark border-[#ff9800]/30 mt-auto">
        <div class="max-w-6xl mx-auto flex flex-col items-center gap-6">
            <div class="w-24 h-px bg-[#ff9800]/40"></div>
            <p class="text-xs text-center text-[#ffcc80]/70">
                &copy; 2026 Leka Comedy. All rights reserved.
            </p>
        </div>
    </footer>
</body>
</html>
