<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Leka Comedy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #3e2723; /* Deep vintage brown */
            color: #ffcc80; /* Soft warm text */
        }
        .text-velma {
            color: #ff9800; /* Vibrant retro orange */
        }
        .border-velma {
            border-color: #ff9800;
        }
        .bg-velma-dark {
            background-color: #4e342e;
        }
        .nav-link {
            color: #ffcc80;
        }
        .nav-link.active {
            color: #ff9800;
            background-color: rgba(255, 152, 0, 0.15);
            border: 1px solid rgba(255, 152, 0, 0.5);
            padding: 8px 16px;
            border-radius: 9999px;
        }
        .nav-link:hover {
            color: #ff9800;
        }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col">
    
    <!-- Navigation Header -->
    <header class="border-b border-[#ff9800]/30 sticky top-0 bg-[#3e2723] z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 md:h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center">
                <img src="LKACMDYLogo.jpg" alt="Leka Comedy Logo" class="h-10 md:h-14 w-auto object-contain rounded-md border border-[#ff9800]/50 shadow-sm hover:scale-105 transition-transform duration-200">
            </a>
            <nav class="hidden md:flex gap-6 items-center">
                <a href="index.html" class="text-sm font-semibold nav-link">Home</a>
                <a href="about.html" class="text-sm font-semibold nav-link">About Me</a>
                <a href="gallery.html" class="text-sm font-semibold nav-link">Upcoming Shows</a>
                <a href="reviews.html" class="text-sm font-semibold nav-link">Reviews</a>
                <a href="contact.html" class="text-sm font-semibold nav-link active">Contact</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow py-16 px-4">
        <div class="max-w-2xl mx-auto space-y-10">
            <div class="text-center space-y-4">
                <span class="inline-block px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest border border-velma text-velma bg-[#ff9800]/15">
                    Get in Touch
                </span>
                <h1 class="text-4xl md:text-5xl font-bold text-velma" style="font-family: serif;">Bookings & Inquiries</h1>
                <p class="text-[#ffcc80]/90 text-lg">Interested in booking Leka for a show, showcase, or private event? Drop a line below.</p>
            </div>

            <div class="bg-[#4e342e] p-8 rounded-2xl border-2 border-velma shadow-xl space-y-6">
                <form action="https://formspree.io/f/your-form-id" method="POST" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-velma mb-2">Your Name</label>
                        <input type="text" name="name" required class="w-full px-4 py-3 rounded-xl bg-[#3e2723] border border-velma/40 text-[#ffcc80] focus:outline-none focus:border-velma">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-velma mb-2">Email Address</label>
                        <input type="email" name="email" required class="w-full px-4 py-3 rounded-xl bg-[#3e2723] border border-velma/40 text-[#ffcc80] focus:outline-none focus:border-velma">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-velma mb-2">Message / Event Details</label>
                        <textarea name="message" rows="5" required class="w-full px-4 py-3 rounded-xl bg-[#3e2723] border border-velma/40 text-[#ffcc80] focus:outline-none focus:border-velma"></textarea>
                    </div>
                    <button type="submit" class="w-full py-3 rounded-full font-bold text-sm bg-velma text-[#3e2723] hover:bg-velma/90 transition-all duration-200 shadow-md">
                        Send Message
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t py-10 px-4 bg-velma-dark border-[#ff9800]/30 mt-auto">
        <div class="max-w-6xl mx-auto flex flex-col items-center gap-6">
            <div class="w-24 h-px bg-[#ff9800]/40"></div>
            <p class="text-xs text-center text-[#ffcc80]/70">
                &copy; 2026 Leka Comedy. All rights reserved.
            </p>
        </div>
    </footer>
</body>
</html>
